<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="color-scheme" content="dark">
<title>F-7WHISPER</title>
<style>
@font-face { font-family: Geist; src: url("fonts/Geist-Regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: Geist; src: url("fonts/Geist-Medium.woff2") format("woff2"); font-weight: 500; }
@font-face { font-family: Geist; src: url("fonts/Geist-SemiBold.woff2") format("woff2"); font-weight: 600; }

/* Font: SF Pro (installed on this PC as "SF Pro Text"; the macOS system font via -apple-system); Geist where SF Pro is missing.
   Colours: Vercel Geist dark greys; status green/red from ExcelDB's theme.ts; lines from ExcelDB's redesign.css */
:root {
  --bg: #0a0a0a;
  --text: #ededed;
  --muted: #a1a1a1;
  --faint: #737373;
  --version: #8f8f8f;
  --fill: rgba(255, 255, 255, 0.09);
  --fill-hover: rgba(255, 255, 255, 0.13);
  --field: rgba(255, 255, 255, 0.06);
  --row-hover: rgba(255, 255, 255, 0.03);
  --line: rgba(255, 255, 255, 0.08);
  --divider: rgba(255, 255, 255, 0.06);
  --green: #38c172;
  --red: #ff4d4d;
  --red-text: #ff6166;
  --focus: 0 0 0 1px rgba(255, 255, 255, 0.5), 0 0 0 4px rgba(255, 255, 255, 0.12);
  --font: "SF Pro Text", -apple-system, BlinkMacSystemFont, Geist, "Segoe UI", system-ui, sans-serif;
  --cols: 52px minmax(0, 1fr) 156px 88px 92px 104px 92px 48px;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; }
body {
  display: flex; flex-direction: column;
  background: var(--bg); color: var(--text);
  font: 14px/20px var(--font);
  font-variant-numeric: tabular-nums;
  letter-spacing: -0.01em;   /* SF Pro Text tracking at 13–14 px, which macOS applies by itself */
  user-select: none; -webkit-user-select: none; cursor: default;
}
button { font: inherit; color: inherit; border: 0; padding: 0; background: none; cursor: pointer; corner-shape: round; }
button:focus-visible, input:focus-visible { outline: 0; box-shadow: var(--focus); }
svg { flex: none; display: block; }
.squircle { corner-shape: squircle; }
[hidden] { display: none !important; }

/* ── Top edge: a faint lit line just under Windows' 1 px border (which covers the page's row 0) makes the top read a touch heavier,
   as if lit from above (~6% white, the usual dark-UI top highlight). macOS draws its own frame. ── */
body:not(.mac)::before { content: ""; position: fixed; z-index: 80; top: 1px; left: 0; right: 0; height: 1px; background: rgba(255, 255, 255, 0.06); pointer-events: none; }

/* ── Title bar ── */
.titlebar { flex: none; display: flex; align-items: center; height: 32px; }   /* Windows 11's standard title bar height */
.title { flex: 1 1 auto; min-width: 0; align-self: stretch; display: flex; align-items: center; padding-left: 16px; font-size: 13px; font-weight: 600; }
.ghost { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9999px; color: var(--muted); }
.ghost:hover { background: var(--fill); color: var(--text); }
.gear { margin-right: 2px; }
.pin { margin-right: 6px; }
.pin[aria-pressed="true"] { background: rgba(255, 255, 255, 0.1); color: var(--text); }
.cap { display: grid; place-items: center; width: 46px; height: 32px; color: var(--text); corner-shape: square; }
.cap:hover { background: rgba(255, 255, 255, 0.08); }
.cap.close:hover { background: #c42b1c; color: #fff; }
/* macOS: native traffic lights sit over the left of the bar */
body.mac .cap { display: none; }
body.mac { letter-spacing: normal; }
body.mac .title { padding-left: 84px; }
body.mac .pin { margin-right: 16px; }

/* ── Notices: macOS Accessibility, and the update bar at the top ── */
.notice { flex: none; display: flex; align-items: center; gap: 12px; margin: 0 16px 16px; padding: 6px 6px 6px 14px; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); font-size: 13px; }
.notice span { flex: 1 1 auto; min-width: 0; }
.notice .btn { height: 28px; padding: 0 12px; font-size: 13px; }
/* 4 px clears the caption buttons' hover fill; 12 px + the toolbar's 4 px top padding = the usual 16 px gap */
.notice.update { margin: 4px 16px 12px; }
.update[data-status="failed"] #updateText { color: var(--red-text); }
/* Round download button: the primary white of Add; while busy it turns grey and a ring fills around its edge */
.dl { position: relative; flex: none; display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9999px; background: var(--text); color: var(--bg); }
.dl:hover { background: #d4d4d4; }
.dl:disabled { background: var(--fill); color: var(--text); cursor: default; }
.dl .ring { position: absolute; inset: 0; transform: rotate(-90deg); fill: none; stroke-width: 2; visibility: hidden; }
.dl:disabled .ring { visibility: visible; }
.dl .track { stroke: var(--line); }
.dl .bar { stroke: var(--text); stroke-linecap: round; stroke-dasharray: 78.54; stroke-dashoffset: 78.54; transition: stroke-dashoffset 0.15s linear; }
.dl[data-status="installing"] .ring { animation: dl-spin 0.9s linear infinite; }
@keyframes dl-spin { from { transform: rotate(-90deg); } to { transform: rotate(270deg); } }
.dl .check, .dl[data-status="opened"] .arrow { display: none; }
.dl[data-status="opened"] .check { display: block; }
/* X ("Not now") sits 4 px after the download button */
.notice.update .ghost { margin-left: -8px; }

/* ── Toolbar ── */
/* 4 px clears the caption buttons' hover fill and puts the buttons ~16 px under the title text: the same gap as the sides and the table */
.toolbar { flex: none; display: flex; align-items: center; gap: 8px; height: 52px; padding: 4px 16px 16px; }
.spacer { flex: 1 1 auto; align-self: stretch; }
.btn { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 16px 0 14px; border-radius: 9999px; background: var(--fill); font-size: 14px; font-weight: 500; white-space: nowrap; }
.btn:hover { background: var(--fill-hover); }
.btn.primary { padding: 0 16px 0 12px; background: var(--text); color: var(--bg); }
.btn.primary:hover { background: #d4d4d4; }
.btn.primary:disabled { background: rgba(237, 237, 237, 0.35); cursor: default; }
.btn.has-kbd { padding-right: 6px; }
.actions .btn { padding: 0 16px; }
kbd { display: inline-flex; align-items: center; height: 20px; margin-left: 4px; padding: 0 7px; border-radius: 9999px; background: var(--fill); color: var(--muted); font: 500 12px var(--font); }

/* ── Table (ExcelDB Groups table) ── */
.table { flex: 1 1 auto; min-height: 0; display: flex; flex-direction: column; margin: 0 16px; border-radius: 12px; box-shadow: 0 0 0 1px var(--line); overflow: hidden; }
.tr { display: grid; grid-template-columns: var(--cols); align-items: center; }
.tr > * { min-width: 0; padding: 0 12px; }
.thead { flex: none; height: 36px; color: var(--muted); font-size: 13px; }
.tbody { flex: 1 1 auto; min-height: 0; overflow-y: auto; scrollbar-width: thin; scrollbar-color: transparent transparent; }
.tbody:hover { scrollbar-color: #3a3b3e transparent; }
.row { height: 48px; background-image: linear-gradient(var(--divider), var(--divider)); background-repeat: no-repeat; background-position: 12px 0; background-size: calc(100% - 24px) 1px; }
.row:hover, .row.menu-open { background-color: var(--row-hover); }
.num, .count { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.input { display: flex; align-items: center; gap: 8px; }
.key { min-width: 0; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.every { font-size: 13px; color: var(--muted); white-space: nowrap; }
.pill { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 9999px; font-size: 13px; white-space: nowrap; }
.pill.on { box-shadow: inset 0 0 0 1px var(--green); color: var(--text); }
.pill.off { box-shadow: inset 0 0 0 1px var(--red); color: var(--muted); }
.toggle { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; height: 28px; border-radius: 9999px; background: var(--fill); font-size: 13px; font-weight: 500; }
.toggle:hover { background: var(--fill-hover); }
.toggle.stop { color: var(--red-text); }
.more { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 9999px; color: var(--muted); visibility: hidden; }
.more:hover { background: var(--fill); color: var(--text); }
.row:is(:hover, :focus-within, .menu-open) .more { visibility: visible; }
.empty { display: grid; place-items: center; height: 96px; color: var(--muted); }
.trig { display: flex; align-items: center; gap: 6px; max-width: 100%; height: 28px; padding: 0 8px 0 10px; border-radius: 9999px; background: var(--fill); font-size: 13px; font-weight: 500; white-space: nowrap; }
.trig:hover, .trig[aria-expanded="true"] { background: var(--fill-hover); }
.trig .label { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.trig .mode, .trig .hint { color: var(--muted); font-weight: 400; }
.trig svg { color: var(--muted); }
.trig.bad, .box.bad { box-shadow: inset 0 0 0 1px var(--red); }
.menu hr { height: 1px; margin: 6px 4px; border: 0; background: var(--line); }

/* ── Footer ── */
.foot { flex: none; display: flex; align-items: center; justify-content: flex-end; height: 16px; padding-right: 16px; font-size: 10px; line-height: 16px; color: var(--version); }

/* ── Menus (Vercel dropdown) ── */
.menu { position: fixed; z-index: 40; min-width: 140px; max-height: 240px; overflow-y: auto; padding: 6px; border-radius: 12px; background: var(--bg); box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.145), 0 4px 8px -4px rgba(0, 0, 0, 0.5), 0 16px 24px -8px rgba(0, 0, 0, 0.6); corner-shape: squircle; scrollbar-width: thin; scrollbar-color: #3a3b3e transparent; }
.menu button { display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 100%; height: 36px; padding: 0 10px; border-radius: 8px; font-size: 14px; text-align: left; white-space: nowrap; corner-shape: squircle; }
.menu button > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.menu button:hover, .menu button:focus-visible { background: rgba(255, 255, 255, 0.1); box-shadow: none; }
.menu .danger { color: var(--red-text); }
.menu.apps { z-index: 70; }

/* ── Dialogs ── */
.scrim { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: rgba(0, 0, 0, 0.6); }
.dialog { width: 340px; max-height: calc(100vh - 16px); overflow: auto; margin: 0; padding: 18px; border-radius: 12px; background: var(--bg); box-shadow: 0 0 0 1px var(--line), 0 16px 48px -8px rgba(0, 0, 0, 0.8); corner-shape: squircle; scrollbar-width: none; }
.dialog h2 { margin: 0; font-size: 16px; line-height: 24px; font-weight: 600; }
.dialog > h2 { margin-bottom: 12px; }
.dhead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
.field { display: grid; gap: 6px; margin-bottom: 12px; }
.field > span { font-size: 13px; color: var(--muted); }
.line { display: flex; gap: 8px; height: 36px; }
.box { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 16px; border-radius: 9999px; background: var(--field); font-size: 14px; font-weight: 500; text-align: left; white-space: nowrap; overflow: hidden; corner-shape: round; }
.box .hint { color: var(--faint); font-weight: 400; }
.box.listening { box-shadow: var(--focus); }
.box .mono { font-weight: 400; }
.box.select { justify-content: space-between; }
.box.select > span { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.line input { flex: 1 1 0; min-width: 0; width: 0; height: 36px; padding: 0 16px; border: 0; border-radius: 9999px; background: var(--field); color: var(--text); font: 14px var(--font); letter-spacing: inherit; corner-shape: round; user-select: text; }
.line input::placeholder { color: var(--faint); }
.seg { flex: none; display: inline-flex; align-self: center; padding: 3px; border-radius: 9999px; background: var(--field); }
.seg button { height: 30px; padding: 0 14px; border-radius: 9999px; color: var(--muted); font-size: 13px; font-weight: 500; }
.seg.tight button { padding: 0 10px; }
.seg button[aria-pressed="true"] { background: var(--fill-hover); color: var(--text); }
.clear { flex: none; display: grid; place-items: center; width: 36px; height: 36px; border-radius: 9999px; color: var(--muted); }
.clear:hover { background: var(--fill); color: var(--text); }
.switchrow { display: flex; align-items: center; justify-content: space-between; gap: 12px; height: 36px; margin-bottom: 12px; }
.switch { position: relative; flex: none; width: 36px; height: 20px; border-radius: 9999px; background: rgba(255, 255, 255, 0.14); }
.switch::after { content: ""; position: absolute; top: 2px; left: 2px; width: 16px; height: 16px; border-radius: 9999px; background: var(--muted); transition: left 0.12s; }
.switch[aria-checked="true"] { background: var(--text); }
.switch[aria-checked="true"]::after { left: 18px; background: var(--bg); }
.actions { display: flex; justify-content: space-between; margin-top: 8px; }
</style>
</head>
<body>
<header class="titlebar" id="titlebar">
  <div class="title" data-drag>F-7WHISPER</div>
  <button class="ghost gear" id="gear" type="button" aria-label="Settings">

L5.81246 14.2044C5.91473 14.1679 6.01982 14.1397 6.12667 14.1202C7.21332 13.922 8.25487 14.6423 8.45305 15.729L8.75702 17.3975C9.16489 17.4655 9.58024 17.5 10.0003 17.5C10.42 17.5 10.8351 17.4656 11.2427 17.3976L11.5475 15.7289C11.567 15.6221 11.5951 15.517 11.6317 15.4147C12.0034 14.3746 13.1479 13.8327 14.1881 14.2044L15.784 14.7751C16.3155 14.1322 16.7369 13.4051 17.029 12.6229L15.7353 11.5245C15.6525 11.4542 15.5756 11.3773 15.5053 11.2945C14.7903 10.4525 14.8933 9.1904 15.7353 8.47544L17.029 7.37709C16.7369 6.59486 16.3155 5.86783 15.784 5.22494L14.1881 5.79559C14.0858 5.83214 13.9807 5.8603 13.8738 5.87979C12.7872 6.07796 11.7456 5.3577 11.5475 4.27119L11.2427 2.60235C10.8351 2.53443 10.42 2.5 10.0003 2.5C9.58024 2.5 9.16489 2.53448 8.75702 2.60249L8.45304 4.27105C8.43355 4.37791 8.40539 4.48299 8.36884 4.58527C7.99714 5.62542 6.8526 6.1673 5.81237 5.79556L4.21648 5.22494C3.68504 5.86783 3.26359 6.59486 2.97154 7.37709ZM7.50026 10C7.50026 8.61929 8.61954 7.5 10.0003 7.5C11.381 7.5 12.5003 8.61929 12.5003 10C12.5003 11.3807 11.381 12.5 10.0003 12.5C8.61954 12.5 7.50026 11.3807 7.50026 10ZM8.50026 10C8.50026 10.8284 9.17183 11.5 10.0003 11.5C10.8287 11.5 11.5003 10.8284 11.5003 10C11.5003 9.17157 10.8287 8.5 10.0003 8.5C9.17183 8.5 8.50026 9.17157 8.50026 10Z"/></svg>
  </button>
  <button class="ghost pin" id="pin" type="button" aria-label="Keep on top" aria-pressed="false">
    <!-- Microsoft Fluent UI System Icons "Pin 20 Regular", MIT -->
    <svg width="16" height="16" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true"><path d="M10.12 3.14a2 2 0 0 1 3.2-.52l4.06 4.05a2 2 0 0 1-.52 3.2l-3.46 1.74a1.5 1.5 0 0 0-.72.78L11.25 16a1 1 0 0 1-1.64.33L7 13.7 3.7 17H3v-.7L6.3 13l-2.62-2.61a1 1 0 0 1 .34-1.64L7.6 7.32q.52-.23.78-.72zm2.5.18a1 1 0 0 0-1.6.26L9.29 7.04a2.5 2.5 0 0 1-1.31 1.2L4.39 9.69l5.93 5.93 1.43-3.59a2.5 2.5 0 0 1 1.2-1.3l3.47-1.74a1 1 0 0 0 .25-1.6z"/></svg>
  </button>
  <button class="cap" type="button" data-window="minimize" aria-label="Minimize">
    <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10" fill="none" stroke="currentColor"/></svg>
  </button>
  <button class="cap close" type="button" data-window="close" aria-label="Close">
    <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" fill="none" stroke="currentColor"/></svg>
  </button>
</header>

<div class="notice update squircle" id="update" role="status" hidden>
  <span id="updateText"></span>
  <button class="dl" id="updateBtn" type="button" aria-label="Download and install">
    <svg class="ring" width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><circle class="track" cx="14" cy="14" r="12.5"/><circle class="bar" id="updateRing" cx="14" cy="14" r="12.5"/></svg>
    <svg class="arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></svg>
    <svg class="check" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>
  </button>
  <button class="ghost" id="updateClose" type="button" aria-label="Not now">
    <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" aria-hidden="true"><path d="M2.5 2.5l7 7M9.5 2.5l-7 7"/></svg>
  </button>
</div>

<div class="toolbar">
  <button class="btn" id="startAll" type="button">
    <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.75v8.5L10.25 6z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>Start all<kbd id="startKbd" hidden></kbd>
  </button>
  <button class="btn" id="stopAll" type="button">
    <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" fill="currentColor"/></svg>Stop all<kbd id="stopKbd" hidden></kbd>
  </button>
  <div class="spacer" data-drag></div>
  <button class="btn primary" id="addRow" type="button">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>Add
  </button>
</div>

<div class="notice squircle" id="access" role="status" hidden>
  <span>Allow F-7WHISPER in Accessibility to press keys and click</span>
  <button class="btn" id="openAccess" type="button">Open Settings</button>
</div>

<main class="table squircle" aria-label="Inputs">
  <div class="tr thead" role="row">
    <span>#</span><span>Input</span><span>Activate</span><span>Every</span><span>Presses</span><span>Status</span><span></span><span></span>
  </div>
  <div class="tbody" id="rows"></div>
</main>

<footer class="foot" data-drag><span id="version"></span></footer>

<div class="menu" id="menu" role="menu" hidden>
  <button type="button" role="menuitem" data-menu="edit">Edit</button>
  <button type="button" role="menuitem" class="danger" data-menu="remove">Delete</button>
</div>
<div class="menu apps" id="appMenu" role="menu" hidden></div>
<div class="menu" id="trigMenu" role="menu" hidden></div>

<!-- Add / Edit -->
<div class="scrim" id="addScrim" hidden>

<div class="scrim" id="setScrim" hidden>

        <button class="box" type="button" data-hk="start" id="hkStart" aria-labelledby="startLabel hkStart"></button>

          <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M0.5 0.5l9 9M9.5 0.5l-9 9" fill="none" stroke="currentColor"/></svg>
        </button>

      <span id="twoKeyLabel">Two-key activate keys</span>

    </div>

      <button class="btn" type="button" data-close>Cancel</button>
      <button class="btn primary" type="submit" id="setSave">Save</button>
    </div>
  </form>
</div>

<script>
"use strict";

/* ── Bridge to the host: Tauri (macOS + Windows) or the C# WebView2 host; a mock stands in in a plain browser ── */
const tauri = window.__TAURI__;
const webview = !tauri && window.chrome && window.chrome.webview;
const host = tauri || webview;
const send = (msg) => (tauri ? tauri.core.invoke("page_message", { msg }) : webview ? webview.postMessage(msg) : mock.handle(msg));
if (webview) webview.addEventListener("message", (e) => receive(e.data));
// Tauri only delivers events to listeners that exist, so "ready" waits for the listener.
const listening$ = tauri ? tauri.event.listen("host", (e) => receive(e.payload)) : Promise.resolve();

const UA_MAC = /Mac/.test(navigator.platform || navigator.userAgent);
document.body.classList.toggle("mac", UA_MAC);

const mock = (() => {
  const F6 = { label: "F6", code: "F6", vk: 117, ctrl: false, alt: false, shift: false, meta: false };
  const F7 = { label: "F7", code: "F7", vk: 118, ctrl: false, alt: false, shift: false, meta: false };
  const G = { label: "G", code: "KeyG", vk: 71, ctrl: false, alt: false, shift: false, meta: false };
  const QE = { label: "Q + E", code: "KeyQ", vk: 81, ctrl: false, alt: false, shift: false, meta: false, with: { label: "E", code: "KeyE", vk: 69 } };
  const rows = [
    { id: "a", kind: "key", label: "F", code: "KeyF", vk: 70, app: null, trigger: { hotkey: G, mode: "toggle" }, intervalMs: 250, running: true, count: 1284 },
    { id: "b", kind: "key", label: "Space", code: "Space", vk: 32, app: null, trigger: { hotkey: QE, mode: "hold" }, intervalMs: 1000, running: false, count: 0 },
    { id: "e", kind: "click", button: "left", at: null, app: "RobloxPlayerBeta.exe", trigger: { hotkey: { ...G, label: "X", code: "KeyX", vk: 88 }, mode: "hold" }, intervalMs: 100, running: true, count: 5120 },
  ];
  const st = { pinned: false, hotkeys: { start: F6, stop: F7 }, switchStop: true, twoKey: true };
  const push = () => setTimeout(() => receive({
    type: "state", version: "1.1.0", platform: UA_MAC ? "macos" : "windows", accessOk: true, pinned: st.pinned,
    rows: rows.map((r) => ({ ...r, triggerOk: !!r.trigger && (st.twoKey || !r.trigger.hotkey.with) })), hotkeys: st.hotkeys, hotkeyOk: { start: !!st.hotkeys.start, stop: !!st.hotkeys.stop }, switchStop: st.switchStop, twoKey: st.twoKey,
  }));
  const find = (id) => rows.find((r) => r.id === id);
  const fromInput = (i) => (i.kind === "click"
    ? { kind: "click", button: i.button, at: i.at, label: null, code: null, vk: null }
    : { kind: "key", label: i.key.label, code: i.key.code, vk: i.key.vk, button: null, at: null });
  let pickTimer = 0, updTimer = 0;
  if (!host) setInterval(() => {
    const counts = {};
    rows.forEach((r) => { if (r.running) { r.acc = (r.acc || 0) + 200; const n = Math.floor(r.acc / r.intervalMs); if (n) { r.acc -= n * r.intervalMs; r.count += n; counts[r.id] = r.count; } } });
    if (Object.keys(counts).length) receive({ type: "counts", counts });
  }, 200);
  return {
    handle(m) {
      const r = m.id && find(m.id);
      if (m.type === "toggle" && r) r.running = !r.running;
      else if (m.type === "startAll" || m.type === "stopAll") rows.forEach((x) => (x.running = m.type === "startAll"));
      else if (m.type === "pin") st.pinned = m.on;
      else if (m.type === "add") rows.push({ id: Math.random().toString(36).slice(2, 8), ...fromInput(m.input), app: m.input.app, trigger: m.input.trigger, intervalMs: m.input.intervalMs, running: false, count: 0 });
      else if (m.type === "edit" && r) Object.assign(r, fromInput(m.input), { app: m.input.app, trigger: m.input.trigger, intervalMs: m.input.intervalMs });
      else if (m.type === "remove" && r) rows.splice(rows.indexOf(r), 1);
      else if (m.type === "settings") Object.assign(st, { hotkeys: m.hotkeys, switchStop: m.switchStop }, typeof m.twoKey === "boolean" ? { twoKey: m.twoKey } : {});
      else if (m.type === "listApps") { setTimeout(() => receive({ type: "apps", apps: ["Discord.exe", "javaw.exe", "notepad.exe", "RobloxPlayerBeta.exe"] }), 60); return; }
      else if (m.type === "pickPoint") { pickTimer = setTimeout(() => receive({ type: "point", x: 812, y: 440 }), 1500); return; }
      else if (m.type === "pickCancel") { clearTimeout(pickTimer); return; }
      else if (m.type === "fit") { document.body.style.height = `${m.height}px`; return; }   // preview only: the host sizes the real window
      else if (m.type === "installUpdate") {
        let p = 0;
        clearInterval(updTimer);
        updTimer = setInterval(() => {
          p += 0.08;
          if (p < 1) return receive({ type: "update", version: "1.2.0", status: "downloading", progress: p });
          clearInterval(updTimer);
          receive({ type: "update", version: "1.2.0", status: UA_MAC ? "opened" : "installing", progress: 1 });
        }, 120);
        return;
      }
      else if (m.type !== "ready") return;
      push();
      if (m.type === "ready") setTimeout(() => receive({ type: "update", version: "1.2.0", status: "available", progress: 0 }), 300);
    },
  };
})();

/* ── State and helpers ── */
const $ = (id) => document.getElementById(id);
let state = { rows: [], pinned: false, hotkeys: { start: null, stop: null }, hotkeyOk: { start: false, stop: false }, switchStop: true };
let apps = [];

const isMac = () => (state.platform ? state.platform === "macos" : UA_MAC);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
const fmtCount = (n) => n.toLocaleString("en-US");
function fmtEvery(ms) {
  if (ms >= 60000 && ms % 60000 === 0) return `${ms / 60000} min`;
  if (ms >= 1000) return `${+(ms / 1000).toFixed(3)} s`;
  return `${ms} ms`;
}
const BUTTON_NAME = { left: "Left click", right: "Right click", middle: "Middle click", back: "Mouse back", forward: "Mouse forward" };
const rowName = (r) => (r.kind === "click" ? BUTTON_NAME[r.button] || "Left click" : r.label);
function rowTitle(r) {
  let t = rowName(r);
  if (r.kind === "click" && r.at) t += ` at ${r.at.x}, ${r.at.y}`;
  if (r.app) t += ` in ${r.app}`;
  return t;
}
// A two-key hotkey ("with" = second key) is the same binding in either order: F7 + G = G + F7.
const keysOf = (h) => [h.code, h.with ? h.with.code : ""].sort().join("\n");
const sameHotkey = (a, b) => !!a && !!b && keysOf(a) === keysOf(b) && ["ctrl", "alt", "shift", "meta"].every((m) => !!a[m] === !!b[m]);
// The host sends twoKey only when it supports two-key activate keys.
const twoKeyHost = () => typeof state.twoKey === "boolean";
const twoKeyOn = () => twoKeyHost() && state.twoKey;

const ICON_PLAY = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M3 1.75v8.5L10.25 6z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/></svg>';
const ICON_STOP = '<svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><rect x="2" y="2" width="8" height="8" fill="currentColor"/></svg>';
const ICON_MORE = '<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="5" cy="12" r="1.5"/><circle cx="12" cy="12" r="1.5"/><circle cx="19" cy="12" r="1.5"/></svg>';
const ICON_MOUSE = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#a1a1a1" stroke-width="1.2" stroke-linecap="round" aria-hidden="true"><rect x="3.75" y="1.25" width="8.5" height="13.5" rx="4.25"/><path d="M8 4.25v2.5"/></svg>';
const ICON_CHECK = '<svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg>';

/* ── Window height follows the content: rows up to MAX_ROWS, then the table scrolls ── */
const MAX_ROWS = 8;
const WIDTH = 800;
let lastFit = 0;
function neededHeight() {
  const n = state.rows.length;
  let h = 32 + 52 + 36 + (n ? Math.min(n, MAX_ROWS) * 48 : 96) + 16;
  if (!$("access").hidden) h += $("access").offsetHeight + 16;
  if (!$("update").hidden) h += $("update").offsetHeight + 16;
  for (const d of document.querySelectorAll(".scrim:not([hidden]) .dialog")) h = Math.max(h, d.scrollHeight + 32);
  return Math.ceil(h);
}
function fit() {
  requestAnimationFrame(() => {
    const h = neededHeight();
    if (h !== lastFit) { lastFit = h; send({ type: "fit", height: h, width: WIDTH }); }
  });
}

/* ── Rendering ── */
function renderKbd(which) {
  const kbd = $(`${which}Kbd`);
  const hk = state.hotkeys && state.hotkeys[which];
  const ok = !!(hk && state.hotkeyOk && state.hotkeyOk[which]);
  kbd.hidden = !ok;
  kbd.textContent = ok ? hk.label : "";
  $(`${which}All`).classList.toggle("has-kbd", ok);
}

function render() {
  document.body.classList.toggle("mac", isMac());
  $("access").hidden = state.accessOk !== false;
  $("pin").setAttribute("aria-pressed", String(!!state.pinned));
  $("version").textContent = state.version ? `v${state.version}` : "";
  renderKbd("start");
  renderKbd("stop");

  const focusedId = document.activeElement && document.activeElement.closest(".row") ? document.activeElement.closest(".row").dataset.id : null;
  const focusedRole = document.activeElement && document.activeElement.dataset.role;
  $("rows").innerHTML = state.rows.length
    ? state.rows.map((r, i) => `
      <div class="tr row" role="row" data-id="${esc(r.id)}">
        <span class="num">${i + 1}</span>
        <span class="input" title="${esc(rowTitle(r))}">${r.kind === "click" ? ICON_MOUSE : ""}<strong class="key">${esc(rowName(r))}</strong></span>
        <span>${trigChip(r)}</span>
        <span class="every">${esc(fmtEvery(r.intervalMs))}</span>
        <span class="count">${fmtCount(r.count)}</span>
        <span><span class="pill ${r.running ? "on" : "off"}">${r.running ? "Running" : "Stopped"}</span></span>
        <span><button class="toggle ${r.running ? "stop" : ""}" type="button" data-role="toggle">${r.running ? ICON_STOP + "Stop" : ICON_PLAY + "Start"}</button></span>
        <span><button class="more" type="button" data-role="more" aria-label="More for ${esc(rowName(r))}" aria-haspopup="menu" aria-expanded="false">${ICON_MORE}</button></span>
      </div>`).join("")
    : '<div class="empty">Nothing added yet</div>';

  if (focusedId && focusedRole) {
    const again = document.querySelector(`.row[data-id="${CSS.escape(focusedId)}"] [data-role="${focusedRole}"]`);
    if (again) again.focus();
  }
  // Rebuilt rows lose their open-menu marks; put them back, or close a menu whose row is gone.
  for (const [id, sel, close] of [[menuFor, ".more", closeMenu], [trigFor, ".trig", closeTrigMenu]]) {
    if (!id) continue;
    const row = document.querySelector(`.row[data-id="${CSS.escape(id)}"]`);
    if (!row) { close(); continue; }
    row.classList.add("menu-open");
    row.querySelector(sel).setAttribute("aria-expanded", "true");
  }
  fit();
}

/* ── Update bar: the host checks GitHub Releases and sends { type: "update", version, status, progress } ── */
let update = null;
const RING = 2 * Math.PI * 12.5;
function renderUpdate() {
  const box = $("update");
  box.hidden = !update;
  if (!update) return;
  const v = update.version, s = update.status;
  box.dataset.status = s;
  $("updateText").textContent = {
    downloading: `Downloading version ${v}`,
    installing: `Installing version ${v}`,
    opened: "Drag F-7WHISPER to Applications, then reopen it",
    failed: "Download failed",
  }[s] || `Update to version ${v}?`;
  const btn = $("updateBtn");
  const busy = s === "downloading" || s === "installing";
  btn.dataset.status = s;
  btn.disabled = busy || s === "opened";
  btn.setAttribute("aria-label", s === "failed" ? "Try again" : "Update");
  $("updateClose").hidden = busy;   // neither a download nor an install can be stopped
  const p = s === "downloading" ? Math.max(0, Math.min(1, Number(update.progress) || 0)) : s === "installing" ? 0.25 : s === "opened" ? 1 : 0;
  const bar = $("updateRing");
  bar.style.strokeDashoffset = String(RING * (1 - p));
  bar.style.opacity = p > 0 ? "1" : "0";   // a round cap would show as a dot at 0 %
}
$("updateBtn").addEventListener("click", () => {
  if (!update || !(update.status === "available" || update.status === "failed")) return;
  update = { ...update, status: "downloading", progress: 0 };
  renderUpdate();
  send({ type: "installUpdate" });
});
// Nothing downloads until the button is clicked. X hides the offer until F-7WHISPER next starts.
let dismissed = null;
$("updateClose").addEventListener("click", () => {
  if (!update) return;
  dismissed = update.version;
  update = null;
  renderUpdate();
  fit();
});

const MODE_NAME = { hold: "Hold", toggle: "Press" };
const ICON_CHEVRON = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4.5l3 3 3-3"/></svg>';
function trigChip(r) {
  const t = r.trigger;
  const body = t
    ? `<span class="mode">${MODE_NAME[t.mode] || "Hold"}</span><span class="label">${esc(t.hotkey.label)}</span>`
    : '<span class="hint">None</span>';
  const title = t ? `${MODE_NAME[t.mode] || "Hold"} ${t.hotkey.label}` : "No activate key";
  return `<button class="trig${t && r.triggerOk === false ? " bad" : ""}" type="button" data-role="trig" title="${esc(title)}" aria-haspopup="menu" aria-expanded="false">${body}${ICON_CHEVRON}</button>`;
}
function inputOf(r, trigger) {
  return r.kind === "click"
    ? { kind: "click", button: r.button, at: r.at || null, intervalMs: r.intervalMs, app: r.app || null, trigger }
    : { kind: "key", key: { label: r.label, code: r.code, vk: r.vk }, intervalMs: r.intervalMs, app: r.app || null, trigger };
}

function receive(msg) {
  if (!msg || typeof msg !== "object") return;
  if (msg.type === "state") { state = msg; render(); }
  else if (msg.type === "update") {
    if (msg.status === "available" && msg.version === dismissed) return;   // the 6-hourly re-check of an offer closed with X
    update = typeof msg.version === "string" ? msg : null;
    renderUpdate();
    fit();
  }
  else if (msg.type === "counts") {
    for (const [id, n] of Object.entries(msg.counts || {})) {
      const row = state.rows.find((r) => r.id === id);
      if (row) row.count = n;
      const cell = document.querySelector(`.row[data-id="${CSS.escape(id)}"] .count`);
      if (cell) cell.textContent = fmtCount(n);
    }
  }
  else if (msg.type === "apps") { apps = Array.isArray(msg.apps) ? msg.apps.filter((a) => typeof a === "string") : []; if (!$("appMenu").hidden) fillAppMenu(); }
  else if (msg.type === "point" && add.picking) {
    add.picking = false;
    add.at = { x: Math.round(msg.x), y: Math.round(msg.y) };
    showAdd();
    $("pick").focus();
  }
}

/* ── Window: drag and caption buttons ── */
document.addEventListener("mousedown", (e) => {
  if (e.button !== 0 || !e.target.closest("[data-drag]") || e.target.closest("button")) return;
  e.preventDefault();
  send({ type: "window", action: "drag" });
});
$("titlebar").addEventListener("click", (e) => {
  const b = e.target.closest("[data-window]");
  if (b) send({ type: "window", action: b.dataset.window });
});
$("pin").addEventListener("click", () => send({ type: "pin", on: !state.pinned }));
$("gear").addEventListener("click", openSettings);
$("startAll").addEventListener("click", () => send({ type: "startAll" }));
$("stopAll").addEventListener("click", () => send({ type: "stopAll" }));
$("addRow").addEventListener("click", () => openAdd(null));

/* ── Rows ── */
$("rows").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-role]");
  const row = e.target.closest(".row");
  if (!btn || !row) return;
  if (btn.dataset.role === "toggle") send({ type: "toggle", id: row.dataset.id });
  if (btn.dataset.role === "more") menuFor === row.dataset.id ? closeMenu() : openMenu(row.dataset.id, btn);
  if (btn.dataset.role === "trig") trigFor === row.dataset.id ? closeTrigMenu() : openTrigMenu(row.dataset.id, btn);
});

/* ── Menus ── */
function placeMenu(menu, anchor, align) {   // align: "right" | "left" | "match" (same width as the anchor)
  menu.hidden = false;
  menu.style.maxHeight = "";
  const a = anchor.getBoundingClientRect();
  const below = window.innerHeight - 8 - (a.bottom + 4);

    e.stopPropagation();
    if (e.key === "Escape") { stopListening(); return; }
    if (!codeOf(e) || MOD_CODE.test(e.code)) return;    // wait for the key that goes with the modifiers
    set.draft[set.listening] = hotkeyFrom(e);
    stopListening();
    return;
  }
  if (e.key === "Escape") { e.preventDefault(); closeSettings(); }
  if (e.key === "Tab") trapTab($("setDialog"), e);
});
$("setDialog").addEventListener("submit", (e) => {
  e.preventDefault();
  if (sameHotkey(set.draft.start, set.draft.stop)) return;
  send({ type: "settings", hotkeys: { start: set.draft.start, stop: set.draft.stop }, switchStop: set.draft.switchStop, ...(twoKeyHost() ? { twoKey: set.draft.twoKey } : {}) });
  closeSettings();
});

/* ── Mouse back / forward: a listening field takes them; they never navigate the page ── */
document.addEventListener("mousedown", (e) => {
  if (!MOUSE[e.button]) return;
  e.preventDefault();
  e.stopPropagation();
  if (set.listening) { set.draft[set.listening] = hotkeyFrom(e); stopListening(); }
  else if (add.trigListening) { add.trigger = hotkeyFrom(e); stopTrigListen(); }
  else if (add.listening) {
    // A side button in the Key field means "click it": switch the row to Click with that button.
    add.listening = false;
    add.kind = "click";
    add.button = e.button === 3 ? "back" : "forward";
    if (!$("intervalValue").value) { $("intervalValue").value = "100"; add.unit = "ms"; }
    showAdd();
  }
}, true);
for (const type of ["mouseup", "auxclick"]) document.addEventListener(type, (e) => { if (MOUSE[e.button]) e.preventDefault(); }, true);

document.addEventListener("contextmenu", (e) => e.preventDefault());
document.addEventListener("dragstart", (e) => e.preventDefault());

$("openAccess").addEventListener("click", () => send({ type: "openAccessSettings" }));
listening$.then(() => { lastFit = 0; send({ type: "ready" }); });
</script>
</body>
</html>
